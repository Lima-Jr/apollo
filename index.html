<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#555555">
<title>Apollo Brick Game</title>
<style>
*{
  box-sizing:border-box;
}
body{
  min-height:100vh;
  min-height:100svh;
  margin:0;
  padding:20px 12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#555;
  font-family:monospace;
}
.intro-overlay{
  position:fixed;
  inset:0;
  z-index:5;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(20,23,20,.82);
}
.intro-overlay[hidden],
.intro-step[hidden]{
  display:none;
}
.intro-dialog{
  width:min(100%,420px);
  padding:26px;
  border:8px solid #444;
  border-radius:4px;
  background:#cfd8c3;
  color:#171b17;
  box-shadow:0 16px 42px #0009;
}
.intro-kicker{
  margin:0 0 10px;
  color:#566052;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
}
.intro-dialog h1{
  margin:0 0 12px;
  font-size:24px;
}
.intro-copy{
  margin:0 0 20px;
  line-height:1.55;
}
.name-form{
  display:grid;
  gap:10px;
}
.name-form label{
  display:grid;
  gap:7px;
  font-size:13px;
  font-weight:700;
}
.name-form input{
  width:100%;
  min-height:44px;
  padding:8px 10px;
  border:2px solid #566052;
  border-radius:4px;
  background:#f1f3eb;
  color:#171b17;
  font:16px monospace;
}
.name-form input:focus-visible{
  outline:3px solid #d16b3f;
  outline-offset:2px;
}
.intro-action{
  width:100%;
  min-height:46px;
  margin-top:6px;
  border-color:#843d22;
  background:#a94f2b;
  color:#fff;
}
.intro-action:hover:not(:disabled){
  background:#873f24;
}
.console{
  display:flex;
  align-items:stretch;
  gap:30px;
  padding:30px;
  border:12px solid #444;
  border-radius:4px;
  background:#cfd8c3;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}
canvas{
  display:block;
  width:200px;
  height:auto;
  border:4px solid #111;
  background:#cfd8c3;
  touch-action:none;
}
.hud{
  position:relative;
  min-width:160px;
  display:flex;
  flex-direction:column;
  color:#111;
  font-size:16px;
}
.toasty-pop{
  position:absolute;
  top:0;
  right:0;
  z-index:2;
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 6px;
  border:2px solid #30251c;
  background:#f5d58a;
  color:#a3331c;
  font:bold 12px monospace;
  opacity:0;
  pointer-events:none;
  transform:translate(12px,5px) scale(.7);
  transform-origin:top right;
}
.toasty-pop[hidden]{
  display:none;
}
.toasty-pop.is-visible{
  animation:toasty-pop 850ms steps(5,end) both;
}
.toasty-icon{
  position:relative;
  width:18px;
  height:20px;
  flex:none;
  border:2px solid #57321f;
  border-radius:5px 5px 2px 2px;
  background:#e6a344;
  box-shadow:inset 0 0 0 2px #f8d589;
}
.toasty-icon::before{
  position:absolute;
  top:6px;
  left:3px;
  width:3px;
  height:3px;
  background:#39251b;
  box-shadow:6px 0 #39251b;
  content:"";
}
.toasty-icon::after{
  position:absolute;
  bottom:3px;
  left:4px;
  width:5px;
  height:2px;
  background:#39251b;
  content:"";
}
@keyframes toasty-pop{
  0%{opacity:0;transform:translate(12px,5px) scale(.7)}
  18%,72%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(0,-8px) scale(.95)}
}
.stat{
  margin-bottom:18px;
}
.stat-label{
  display:block;
  margin-bottom:4px;
  font-size:12px;
  font-weight:700;
}
.stat output{
  font-variant-numeric:tabular-nums;
  font-size:20px;
  font-weight:700;
}
.game-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
button{
  min-width:40px;
  min-height:42px;
  padding:6px 10px;
  border:2px solid #252925;
  border-radius:4px;
  background:#343a34;
  color:#f0f1e9;
  font:700 14px monospace;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){
  background:#414941;
}
button:focus-visible{
  outline:3px solid #d16b3f;
  outline-offset:2px;
}
button:disabled{
  cursor:not-allowed;
  opacity:.5;
}
.game-actions button{
  flex:1;
  padding:7px;
  font-size:12px;
}
#start-button{
  background:#a94f2b;
}
.touch-controls{
  display:none;
}
@media(max-width:600px){
  body{
    justify-content:flex-start;
    padding:16px 12px 24px;
  }
  .console{
    width:min(100%,360px);
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:14px;
    border-width:8px;
  }
  canvas{
    width:min(200px,58vw);
  }
  .hud{
    width:100%;
    min-width:0;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:start;
    gap:8px;
    font-size:14px;
  }
  .stat{
    min-width:0;
    margin:0;
  }
  .stat-label{
    font-size:10px;
  }
  .stat output{
    font-size:17px;
  }
  .game-actions{
    grid-column:1/-1;
    justify-content:center;
    margin-top:3px;
  }
  .game-actions button{
    min-height:44px;
    font-size:11px;
  }
  .touch-controls{
    width:min(100%,360px);
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin-top:18px;
  }
  .touch-controls button{
    min-height:58px;
    font-size:24px;
    user-select:none;
    touch-action:none;
  }
}
@media(max-width:340px){
  .console{
    padding:11px;
  }
  .touch-controls{
    gap:7px;
  }
  .touch-controls button{
    min-height:52px;
  }
}
@media(max-height:520px) and (orientation:landscape){
  body{
    justify-content:flex-start;
    padding-top:8px;
  }
  .console{
    flex-direction:row;
    width:auto;
    padding:10px;
  }
  canvas{
    width:auto;
    height:min(70vh,400px);
  }
  .hud{
    width:150px;
    display:flex;
  }
  .touch-controls{
    width:min(100%,420px);
    display:grid;
    margin-top:12px;
  }
}
</style>
</head>
<body>
<div class="intro-overlay" id="intro-overlay">
  <section class="intro-dialog" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro-step" id="welcome-step">
      <p class="intro-kicker">APOLLO BRICK GAME</p>
      <h1 id="intro-title">Bem-vindo ao Apollo!</h1>
      <p class="intro-copy">Antes de começar, como podemos chamar você?</p>
      <form class="name-form" id="name-form">
        <label for="player-name">Seu nome</label>
        <input id="player-name" name="playerName" type="text" maxlength="20" autocomplete="given-name" required>
        <button class="intro-action" type="submit">Continuar</button>
      </form>
    </div>
    <div class="intro-step" id="warning-step" hidden>
      <p class="intro-kicker">ALERTA DE MISSÃO</p>
      <h1>Prepare-se!</h1>
      <p class="intro-copy" id="warning-message"></p>
      <button class="intro-action" id="enter-game-button" type="button">Vamos nessa</button>
    </div>
  </section>
</div>

<main class="console" aria-label="Apollo Brick Game">
  <canvas id="game" width="200" height="400" aria-label="Tabuleiro do jogo">
    Seu navegador não oferece suporte ao canvas.
  </canvas>
  <section class="hud" aria-label="Painel do jogo">
    <div class="toasty-pop" id="toasty-pop" aria-live="polite" aria-atomic="true" hidden>
      <span class="toasty-icon" aria-hidden="true"></span>
      <span>TOASTY!</span>
    </div>
    <div class="stat">
      <span class="stat-label">SCORE</span>
      <output id="score" aria-live="polite">000000</output>
    </div>
    <div class="stat">
      <span class="stat-label">HIGH SCORE</span>
      <output id="high-score" aria-live="polite">000000</output>
    </div>
    <div class="stat">
      <span class="stat-label">LEVEL</span>
      <output id="level">0</output>
    </div>
    <div class="stat">
      <span class="stat-label">LINES</span>
      <output id="lines" aria-live="polite">0</output>
    </div>
    <div class="game-actions">
      <button id="start-button" type="button">Começar</button>
      <button id="pause-button" type="button" disabled>Pausar</button>
      <button id="reset-button" type="button">Reiniciar</button>
    </div>
  </section>
</main>

<nav class="touch-controls" aria-label="Controles de toque">
  <button type="button" data-control="left" aria-label="Mover para a esquerda">←</button>
  <button type="button" data-control="rotate" aria-label="Girar peça">↻</button>
  <button type="button" data-control="hard-drop" aria-label="Queda instantânea">⇊</button>
  <button type="button" data-control="right" aria-label="Mover para a direita">→</button>
</nav>

<script>
const COLS=10;
const ROWS=20;
const HIDDEN=2;
const BLOCK=20;
const speedTable=[800,720,630,550,470,390,320,260,210,170];
const MIN_DROP_DELAY=70;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreOutput=document.getElementById("score");
const highScoreOutput=document.getElementById("high-score");
const levelOutput=document.getElementById("level");
const linesOutput=document.getElementById("lines");
const toastyPop=document.getElementById("toasty-pop");
const startButton=document.getElementById("start-button");
const pauseButton=document.getElementById("pause-button");
const introOverlay=document.getElementById("intro-overlay");
const welcomeStep=document.getElementById("welcome-step");
const warningStep=document.getElementById("warning-step");
const playerNameInput=document.getElementById("player-name");
const warningMessage=document.getElementById("warning-message");
const enterGameButton=document.getElementById("enter-game-button");

let grid;
let piece=null;
let next;
let score=0;
let highScore=loadHighScore();
let level=0;
let lines=0;
let started=false;
let gameOver=false;
let paused=false;
let dropTimer=null;
let clearTimer=null;
let activeDropDelay=null;
let clearingLines=null;
let flashState=false;
let audioCtx=null;
let playerName="";
let introComplete=false;
let toastyTimeout=null;

const SHAPES={
  I:[[1,1,1,1]],
  J:[[1,0,0],[1,1,1]],
  L:[[0,0,1],[1,1,1]],
  O:[[1,1],[1,1]],
  S:[[0,1,1],[1,1,0]],
  T:[[0,1,0],[1,1,1]],
  Z:[[1,1,0],[0,1,1]]
};

function loadHighScore(){
  try{
    const savedScore=Number(window.localStorage.getItem("apolloHighScore"));
    return Number.isFinite(savedScore)&&savedScore>0?savedScore:0;
  }catch(error){
    return 0;
  }
}

function saveHighScore(){
  try{
    window.localStorage.setItem("apolloHighScore",String(highScore));
  }catch(error){
    return;
  }
}

function initAudio(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass) return;
  if(!audioCtx) audioCtx=new AudioContextClass();
  if(audioCtx.state==="suspended") audioCtx.resume();
}

function beep(freq,duration){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="square";
  osc.frequency.value=freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+duration/1000);
  osc.start();
  osc.stop(audioCtx.currentTime+duration/1000);
}

function soundMove(){beep(900,40);}
function soundRotate(){beep(600,70);}
function soundLine(){
  beep(1000,80);
  setTimeout(()=>beep(700,80),80);
  setTimeout(()=>beep(500,100),160);
}
function soundGameOver(){
  beep(400,200);
  setTimeout(()=>beep(250,300),200);
}

function randomShape(){
  const keys=Object.keys(SHAPES);
  return keys[Math.floor(Math.random()*keys.length)];
}

function getDropDelay(){
  const speedSteps=Math.floor(score/1000);
  return Math.max(MIN_DROP_DELAY,Math.round(speedTable[0]*Math.pow(0.9,speedSteps)));
}

function updateDropTimer(){
  const nextDelay=getDropDelay();
  if(nextDelay===activeDropDelay) return;
  activeDropDelay=nextDelay;
  if(dropTimer) clearInterval(dropTimer);
  dropTimer=null;
  if(started&&!gameOver) dropTimer=setInterval(drop,activeDropDelay);
}

function resetGame(){
  if(dropTimer) clearInterval(dropTimer);
  if(clearTimer) clearInterval(clearTimer);
  dropTimer=null;
  clearTimer=null;
  activeDropDelay=null;
  grid=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(0));
  piece=null;
  next=randomShape();
  score=0;
  level=0;
  lines=0;
  started=false;
  gameOver=false;
  paused=false;
  clearingLines=null;
  flashState=false;
  clearTimeout(toastyTimeout);
  toastyTimeout=null;
  toastyPop.hidden=true;
  toastyPop.classList.remove("is-visible");
  updateHUD();
}

function rotate(matrix){
  return matrix[0].map((_,index)=>matrix.map(row=>row[index]).reverse());
}

function spawn(){
  const shape=SHAPES[next].map(row=>row.slice());
  piece={
    shape,
    x:Math.floor((COLS-shape[0].length)/2),
    y:0
  };
  next=randomShape();
  if(collide(piece)){
    gameOver=true;
    started=false;
    if(dropTimer) clearInterval(dropTimer);
    dropTimer=null;
    soundGameOver();
    updateHUD();
  }
}

function collide(currentPiece){
  for(let y=0;y<currentPiece.shape.length;y++){
    for(let x=0;x<currentPiece.shape[y].length;x++){
      if(!currentPiece.shape[y][x]) continue;
      const ny=y+currentPiece.y;
      const nx=x+currentPiece.x;
      if(nx<0||nx>=COLS||ny>=ROWS+HIDDEN) return true;
      if(ny>=0&&grid[ny][nx]) return true;
    }
  }
  return false;
}

function merge(){
  piece.shape.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value) grid[y+piece.y][x+piece.x]=1;
    });
  });
}

function checkLines(){
  const completed=[];
  for(let y=HIDDEN;y<ROWS+HIDDEN;y++){
    if(grid[y].every(cell=>cell===1)) completed.push(y);
  }

  if(completed.length){
    clearingLines=completed;
    pauseForClear();
  }else{
    spawn();
    updateHUD();
  }
}

function pauseForClear(){
  let flashes=0;
  clearTimer=setInterval(()=>{
    flashState=!flashState;
    flashes++;
    if(flashes>=6){
      clearInterval(clearTimer);
      clearTimer=null;
      removeLines();
      clearingLines=null;
      spawn();
      updateHUD();
    }
  },80);
}

function removeLines(){
  soundLine();
  const removed=new Set(clearingLines);
  grid=grid.filter((_,index)=>!removed.has(index));
  for(let count=0;count<removed.size;count++) grid.unshift(Array(COLS).fill(0));

  const points=[0,40,100,300,1200];
  const previousScore=score;
  score=Math.min(999999,score+points[removed.size]*(level+1));
  if(Math.floor(score/1000)>Math.floor(previousScore/1000)){
    showToasty();
  }
  if(score>highScore){
    highScore=score;
    saveHighScore();
  }
  level=Math.floor(score/1000);
  lines+=removed.size;
  updateDropTimer();
  updateHUD();
}

function showToasty(){
  clearTimeout(toastyTimeout);
  toastyPop.hidden=false;
  toastyPop.classList.remove("is-visible");
  void toastyPop.offsetWidth;
  toastyPop.classList.add("is-visible");
  toastyTimeout=setTimeout(()=>{
    toastyPop.hidden=true;
    toastyPop.classList.remove("is-visible");
    toastyTimeout=null;
  },850);
}

function drop(){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  piece.y++;
  if(collide(piece)){
    piece.y--;
    merge();
    checkLines();
  }
}

function startGame(){
  if(!introComplete) return;
  initAudio();
  if(gameOver) resetGame();
  if(started) return;
  started=true;
  spawn();
  if(!gameOver) updateDropTimer();
  updateHUD();
}

function togglePause(){
  if(!started||gameOver||clearingLines) return;
  paused=!paused;
  updateHUD();
}

function movePiece(direction){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  piece.x+=direction;
  if(collide(piece)) piece.x-=direction;
  else soundMove();
}

function rotatePiece(){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  const previousShape=piece.shape;
  piece.shape=rotate(piece.shape);
  if(collide(piece)) piece.shape=previousShape;
  else soundRotate();
}

function hardDrop(){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  while(true){
    piece.y++;
    if(collide(piece)){
      piece.y--;
      break;
    }
  }
  merge();
  checkLines();
}

function drawBlock(x,y,color="#111"){
  ctx.fillStyle=color;
  ctx.fillRect(x*BLOCK,(y-HIDDEN)*BLOCK,BLOCK-2,BLOCK-2);
}

function drawMessage(){
  let messages=[];
  let messageColor="#111";
  if(!started&&!gameOver) messages=["APOLLO","PRESS START"];
  else if(paused) messages=["Pera aí"];
  else if(gameOver){
    messages=score<5000?["Medíocre"]:["Tem potencial,","mas ñ foi dessa vez"];
    messageColor="#c62828";
  }
  if(!messages.length) return;

  ctx.fillStyle=messageColor;
  ctx.textAlign="center";
  ctx.font="bold 14px monospace";
  const centerY=canvas.height/2;
  const lineHeight=22;
  const firstY=centerY-(messages.length-1)*lineHeight/2;
  messages.forEach((message,index)=>ctx.fillText(message,canvas.width/2,firstY+index*lineHeight));
  ctx.textAlign="start";
}

function draw(){
  ctx.fillStyle="#cfd8c3";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  grid.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(!value||y<HIDDEN) return;
      const flashing=clearingLines&&clearingLines.includes(y)&&flashState;
      drawBlock(x,y,flashing?"#fff":"#111");
    });
  });

  if(piece&&!clearingLines){
    piece.shape.forEach((row,y)=>{
      row.forEach((value,x)=>{
        if(value&&piece.y+y>=HIDDEN) drawBlock(piece.x+x,piece.y+y);
      });
    });
  }

  ctx.strokeStyle="rgba(0,0,0,.08)";
  for(let x=0;x<=COLS;x++){
    ctx.beginPath();
    ctx.moveTo(x*BLOCK,0);
    ctx.lineTo(x*BLOCK,ROWS*BLOCK);
    ctx.stroke();
  }
  for(let y=0;y<=ROWS;y++){
    ctx.beginPath();
    ctx.moveTo(0,y*BLOCK);
    ctx.lineTo(COLS*BLOCK,y*BLOCK);
    ctx.stroke();
  }
  drawMessage();
}

function updateHUD(){
  scoreOutput.textContent=String(score).padStart(6,"0");
  highScoreOutput.textContent=String(highScore).padStart(6,"0");
  levelOutput.textContent=String(level);
  linesOutput.textContent=String(lines);
  startButton.textContent=gameOver?"Jogar de novo":started?"Em jogo":"Começar";
  startButton.disabled=!introComplete||(started&&!gameOver);
  pauseButton.textContent=paused?"Continuar":"Pausar";
  pauseButton.disabled=!started||gameOver;
}

function performControl(control){
  if(control==="left") movePiece(-1);
  if(control==="right") movePiece(1);
  if(control==="rotate") rotatePiece();
  if(control==="down") drop();
  if(control==="hard-drop") hardDrop();
}

document.addEventListener("keydown",event=>{
  if(!introComplete) return;
  const key=event.key.toLowerCase();
  const handledKeys=["arrowleft","arrowright","arrowup","arrowdown","a","d","w","s"," ","enter","p","escape"];
  if(!handledKeys.includes(key)) return;
  event.preventDefault();

  if(key==="p"||key==="escape"){
    togglePause();
    return;
  }
  if(!started&&!gameOver&&key==="enter"){
    startGame();
    return;
  }
  if(gameOver&&key==="enter"){
    startGame();
    return;
  }
  if(!started||paused||clearingLines) return;
  if(key==="arrowleft"||key==="a") movePiece(-1);
  if(key==="arrowright"||key==="d") movePiece(1);
  if(key==="arrowup"||key==="w") rotatePiece();
  if(key==="arrowdown"||key==="s") drop();
  if(key===" ") hardDrop();
});

document.getElementById("name-form").addEventListener("submit",event=>{
  event.preventDefault();
  playerName=playerNameInput.value.trim();
  if(!playerName){
    playerNameInput.focus();
    return;
  }
  warningMessage.textContent=`Você, ${playerName}, acha que é o mestre dos blocos? Vamos ver então!`;
  welcomeStep.hidden=true;
  warningStep.hidden=false;
  enterGameButton.focus();
});

enterGameButton.addEventListener("click",()=>{
  introComplete=true;
  introOverlay.hidden=true;
  updateHUD();
  startButton.focus();
});

startButton.addEventListener("click",startGame);
pauseButton.addEventListener("click",togglePause);
document.getElementById("reset-button").addEventListener("click",resetGame);

document.querySelectorAll(".touch-controls button").forEach(button=>{
  const control=button.dataset.control;
  let repeatDelay=null;
  let repeatInterval=null;
  let pointerStarted=false;

  function stopRepeating(){
    clearTimeout(repeatDelay);
    clearInterval(repeatInterval);
    repeatDelay=null;
    repeatInterval=null;
  }

  button.addEventListener("pointerdown",event=>{
    event.preventDefault();
    initAudio();
    pointerStarted=true;
    button.setPointerCapture(event.pointerId);
    performControl(control);
    if(control==="left"||control==="right"||control==="down"){
      repeatDelay=setTimeout(()=>{
        repeatInterval=setInterval(()=>performControl(control),100);
      },220);
    }
  });
  button.addEventListener("pointerup",stopRepeating);
  button.addEventListener("lostpointercapture",stopRepeating);
  button.addEventListener("pointercancel",()=>{
    pointerStarted=false;
    stopRepeating();
  });
  button.addEventListener("click",()=>{
    if(pointerStarted){
      pointerStarted=false;
      return;
    }
    initAudio();
    performControl(control);
  });
});

function gameLoop(){
  draw();
  requestAnimationFrame(gameLoop);
}

resetGame();
gameLoop();
playerNameInput.focus();
</script>
