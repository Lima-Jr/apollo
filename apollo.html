<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#555555">
<title>Apollo Brick Game</title>
<style>
*{
  box-sizing:border-box;
}
body{
  min-height:100vh;
  min-height:100svh;
  margin:0;
  padding:20px 12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#555;
  font-family:monospace;
}
.console{
  display:flex;
  align-items:stretch;
  gap:30px;
  padding:30px;
  border:12px solid #444;
  border-radius:4px;
  background:#cfd8c3;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}
canvas{
  display:block;
  width:200px;
  height:auto;
  border:4px solid #111;
  background:#cfd8c3;
  touch-action:none;
}
.hud{
  min-width:160px;
  display:flex;
  flex-direction:column;
  color:#111;
  font-size:16px;
}
.stat{
  margin-bottom:18px;
}
.stat-label{
  display:block;
  margin-bottom:4px;
  font-size:12px;
  font-weight:700;
}
.stat output{
  font-variant-numeric:tabular-nums;
  font-size:20px;
  font-weight:700;
}
.level-control,
.game-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
button{
  min-width:40px;
  min-height:42px;
  padding:6px 10px;
  border:2px solid #252925;
  border-radius:4px;
  background:#343a34;
  color:#f0f1e9;
  font:700 14px monospace;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){
  background:#414941;
}
button:focus-visible{
  outline:3px solid #d16b3f;
  outline-offset:2px;
}
button:disabled{
  cursor:not-allowed;
  opacity:.5;
}
.level-control output{
  min-width:28px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}
.game-actions button{
  flex:1;
  padding:7px;
  font-size:12px;
}
#start-button{
  background:#a94f2b;
}
.touch-controls{
  display:none;
}
@media(max-width:600px){
  body{
    justify-content:flex-start;
    padding:16px 12px 24px;
  }
  .console{
    width:min(100%,360px);
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:14px;
    border-width:8px;
  }
  canvas{
    width:min(200px,58vw);
  }
  .hud{
    width:100%;
    min-width:0;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:start;
    gap:8px;
    font-size:14px;
  }
  .stat{
    min-width:0;
    margin:0;
  }
  .stat-label{
    font-size:10px;
  }
  .stat output{
    font-size:17px;
  }
  .level-control,
  .game-actions{
    grid-column:1/-1;
    justify-content:center;
    margin-top:3px;
  }
  .game-actions button{
    min-height:44px;
    font-size:11px;
  }
  .touch-controls{
    width:min(100%,360px);
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin-top:18px;
  }
  .touch-controls button{
    min-height:58px;
    font-size:24px;
    user-select:none;
    touch-action:none;
  }
}
@media(max-width:340px){
  .console{
    padding:11px;
  }
  .touch-controls{
    gap:7px;
  }
  .touch-controls button{
    min-height:52px;
  }
}
@media(max-height:520px) and (orientation:landscape){
  body{
    justify-content:flex-start;
    padding-top:8px;
  }
  .console{
    flex-direction:row;
    width:auto;
    padding:10px;
  }
  canvas{
    width:auto;
    height:min(70vh,400px);
  }
  .hud{
    width:150px;
    display:flex;
  }
  .touch-controls{
    width:min(100%,420px);
    display:grid;
    margin-top:12px;
  }
}
</style>
</head>
<body>
<main class="console" aria-label="Apollo Brick Game">
  <canvas id="game" width="200" height="400" aria-label="Tabuleiro do jogo">
    Seu navegador não oferece suporte ao canvas.
  </canvas>
  <section class="hud" aria-label="Painel do jogo">
    <div class="stat">
      <span class="stat-label">SCORE</span>
      <output id="score" aria-live="polite">000000</output>
    </div>
    <div class="stat">
      <span class="stat-label">LEVEL</span>
      <output id="level">0</output>
    </div>
    <div class="stat">
      <span class="stat-label">LINES</span>
      <output id="lines" aria-live="polite">0</output>
    </div>
    <div class="level-control" aria-label="Selecionar nível inicial">
      <button id="level-down" type="button" aria-label="Diminuir nível">−</button>
      <button id="level-up" type="button" aria-label="Aumentar nível">+</button>
    </div>
    <div class="game-actions">
      <button id="start-button" type="button">Começar</button>
      <button id="pause-button" type="button" disabled>Pausar</button>
      <button id="reset-button" type="button">Reiniciar</button>
    </div>
  </section>
</main>

<nav class="touch-controls" aria-label="Controles de toque">
  <button type="button" data-control="left" aria-label="Mover para a esquerda">←</button>
  <button type="button" data-control="rotate" aria-label="Girar peça">↻</button>
  <button type="button" data-control="right" aria-label="Mover para a direita">→</button>
  <button type="button" data-control="down" aria-label="Descer peça">↓</button>
</nav>

<script>
const COLS=10;
const ROWS=20;
const HIDDEN=2;
const BLOCK=20;
const speedTable=[800,720,630,550,470,390,320,260,210,170];
const MIN_DROP_DELAY=70;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreOutput=document.getElementById("score");
const levelOutput=document.getElementById("level");
const linesOutput=document.getElementById("lines");
const startButton=document.getElementById("start-button");
const pauseButton=document.getElementById("pause-button");

let grid;
let piece=null;
let next;
let score=0;
let level=0;
let lines=0;
let started=false;
let selectingLevel=true;
let gameOver=false;
let paused=false;
let dropTimer=null;
let clearTimer=null;
let activeDropDelay=null;
let clearingLines=null;
let flashState=false;
let audioCtx=null;

const SHAPES={
  I:[[1,1,1,1]],
  J:[[1,0,0],[1,1,1]],
  L:[[0,0,1],[1,1,1]],
  O:[[1,1],[1,1]],
  S:[[0,1,1],[1,1,0]],
  T:[[0,1,0],[1,1,1]],
  Z:[[1,1,0],[0,1,1]]
};

function initAudio(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass) return;
  if(!audioCtx) audioCtx=new AudioContextClass();
  if(audioCtx.state==="suspended") audioCtx.resume();
}

function beep(freq,duration){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="square";
  osc.frequency.value=freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+duration/1000);
  osc.start();
  osc.stop(audioCtx.currentTime+duration/1000);
}

function soundMove(){beep(900,40);}
function soundRotate(){beep(600,70);}
function soundLine(){
  beep(1000,80);
  setTimeout(()=>beep(700,80),80);
  setTimeout(()=>beep(500,100),160);
}
function soundGameOver(){
  beep(400,200);
  setTimeout(()=>beep(250,300),200);
}

function randomShape(){
  const keys=Object.keys(SHAPES);
  return keys[Math.floor(Math.random()*keys.length)];
}

function getDropDelay(){
  const speedSteps=Math.floor(score/1000);
  return Math.max(MIN_DROP_DELAY,Math.round(speedTable[level]*Math.pow(0.9,speedSteps)));
}

function updateDropTimer(){
  const nextDelay=getDropDelay();
  if(nextDelay===activeDropDelay) return;
  activeDropDelay=nextDelay;
  if(dropTimer) clearInterval(dropTimer);
  dropTimer=null;
  if(started&&!gameOver) dropTimer=setInterval(drop,activeDropDelay);
}

function resetGame(){
  if(dropTimer) clearInterval(dropTimer);
  if(clearTimer) clearInterval(clearTimer);
  dropTimer=null;
  clearTimer=null;
  activeDropDelay=null;
  grid=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(0));
  piece=null;
  next=randomShape();
  score=0;
  lines=0;
  started=false;
  selectingLevel=true;
  gameOver=false;
  paused=false;
  clearingLines=null;
  flashState=false;
  updateHUD();
}

function rotate(matrix){
  return matrix[0].map((_,index)=>matrix.map(row=>row[index]).reverse());
}

function spawn(){
  const shape=SHAPES[next].map(row=>row.slice());
  piece={
    shape,
    x:Math.floor((COLS-shape[0].length)/2),
    y:0
  };
  next=randomShape();
  if(collide(piece)){
    gameOver=true;
    started=false;
    if(dropTimer) clearInterval(dropTimer);
    dropTimer=null;
    soundGameOver();
    updateHUD();
  }
}

function collide(currentPiece){
  for(let y=0;y<currentPiece.shape.length;y++){
    for(let x=0;x<currentPiece.shape[y].length;x++){
      if(!currentPiece.shape[y][x]) continue;
      const ny=y+currentPiece.y;
      const nx=x+currentPiece.x;
      if(nx<0||nx>=COLS||ny>=ROWS+HIDDEN) return true;
      if(ny>=0&&grid[ny][nx]) return true;
    }
  }
  return false;
}

function merge(){
  piece.shape.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value) grid[y+piece.y][x+piece.x]=1;
    });
  });
}

function checkLines(){
  const completed=[];
  for(let y=HIDDEN;y<ROWS+HIDDEN;y++){
    if(grid[y].every(cell=>cell===1)) completed.push(y);
  }

  if(completed.length){
    clearingLines=completed;
    pauseForClear();
  }else{
    spawn();
    updateHUD();
  }
}

function pauseForClear(){
  let flashes=0;
  clearTimer=setInterval(()=>{
    flashState=!flashState;
    flashes++;
    if(flashes>=6){
      clearInterval(clearTimer);
      clearTimer=null;
      removeLines();
      clearingLines=null;
      spawn();
      updateHUD();
    }
  },80);
}

function removeLines(){
  soundLine();
  const removed=new Set(clearingLines);
  grid=grid.filter((_,index)=>!removed.has(index));
  for(let count=0;count<removed.size;count++) grid.unshift(Array(COLS).fill(0));

  const points=[0,40,100,300,1200];
  score=Math.min(999999,score+points[removed.size]*(level+1));
  lines+=removed.size;
  updateDropTimer();
  updateHUD();
}

function drop(){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  piece.y++;
  if(collide(piece)){
    piece.y--;
    merge();
    checkLines();
  }
}

function startGame(){
  initAudio();
  if(gameOver) resetGame();
  if(!selectingLevel||started) return;
  selectingLevel=false;
  started=true;
  spawn();
  if(!gameOver) updateDropTimer();
  updateHUD();
}

function setStartingLevel(change){
  if(!selectingLevel) return;
  level=Math.max(0,Math.min(9,level+change));
  updateHUD();
}

function togglePause(){
  if(!started||gameOver||clearingLines) return;
  paused=!paused;
  updateHUD();
}

function movePiece(direction){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  piece.x+=direction;
  if(collide(piece)) piece.x-=direction;
  else soundMove();
}

function rotatePiece(){
  if(!started||gameOver||paused||clearingLines||!piece) return;
  const previousShape=piece.shape;
  piece.shape=rotate(piece.shape);
  if(collide(piece)) piece.shape=previousShape;
  else soundRotate();
}

function drawBlock(x,y,color="#111"){
  ctx.fillStyle=color;
  ctx.fillRect(x*BLOCK,(y-HIDDEN)*BLOCK,BLOCK-2,BLOCK-2);
}

function drawMessage(){
  let messages=[];
  if(selectingLevel) messages=["APOLLO",`LEVEL ${level}`,"START / ENTER"];
  else if(paused) messages=["Pera aí"];
  else if(gameOver) messages=["GAME OVER","START TO RETRY"];
  if(!messages.length) return;

  ctx.fillStyle="#111";
  ctx.textAlign="center";
  ctx.font="bold 14px monospace";
  const centerY=canvas.height/2;
  const lineHeight=22;
  const firstY=centerY-(messages.length-1)*lineHeight/2;
  messages.forEach((message,index)=>ctx.fillText(message,canvas.width/2,firstY+index*lineHeight));
  ctx.textAlign="start";
}

function draw(){
  ctx.fillStyle="#cfd8c3";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  grid.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(!value||y<HIDDEN) return;
      const flashing=clearingLines&&clearingLines.includes(y)&&flashState;
      drawBlock(x,y,flashing?"#fff":"#111");
    });
  });

  if(piece&&!clearingLines){
    piece.shape.forEach((row,y)=>{
      row.forEach((value,x)=>{
        if(value&&piece.y+y>=HIDDEN) drawBlock(piece.x+x,piece.y+y);
      });
    });
  }

  ctx.strokeStyle="rgba(0,0,0,.08)";
  for(let x=0;x<=COLS;x++){
    ctx.beginPath();
    ctx.moveTo(x*BLOCK,0);
    ctx.lineTo(x*BLOCK,ROWS*BLOCK);
    ctx.stroke();
  }
  for(let y=0;y<=ROWS;y++){
    ctx.beginPath();
    ctx.moveTo(0,y*BLOCK);
    ctx.lineTo(COLS*BLOCK,y*BLOCK);
    ctx.stroke();
  }
  drawMessage();
}

function updateHUD(){
  scoreOutput.textContent=String(score).padStart(6,"0");
  levelOutput.textContent=String(level+Math.floor(score/1000));
  linesOutput.textContent=String(lines);
  startButton.textContent=gameOver?"Jogar de novo":started?"Em jogo":"Começar";
  startButton.disabled=started&&!gameOver;
  pauseButton.textContent=paused?"Continuar":"Pausar";
  pauseButton.disabled=!started||gameOver;
  document.getElementById("level-up").disabled=!selectingLevel;
  document.getElementById("level-down").disabled=!selectingLevel;
}

function performControl(control){
  if(control==="left") movePiece(-1);
  if(control==="right") movePiece(1);
  if(control==="rotate") rotatePiece();
  if(control==="down") drop();
}

document.addEventListener("keydown",event=>{
  const key=event.key.toLowerCase();
  const handledKeys=["arrowleft","arrowright","arrowup","arrowdown","enter","p","escape"];
  if(!handledKeys.includes(key)) return;
  event.preventDefault();

  if(key==="p"||key==="escape"){
    togglePause();
    return;
  }
  if(selectingLevel){
    if(key==="arrowup") setStartingLevel(1);
    if(key==="arrowdown") setStartingLevel(-1);
    if(key==="enter") startGame();
    return;
  }
  if(gameOver&&key==="enter"){
    startGame();
    return;
  }
  if(!started||paused||clearingLines) return;
  if(key==="arrowleft") movePiece(-1);
  if(key==="arrowright") movePiece(1);
  if(key==="arrowup") rotatePiece();
  if(key==="arrowdown") drop();
});

document.getElementById("level-up").addEventListener("click",()=>setStartingLevel(1));
document.getElementById("level-down").addEventListener("click",()=>setStartingLevel(-1));
startButton.addEventListener("click",startGame);
pauseButton.addEventListener("click",togglePause);
document.getElementById("reset-button").addEventListener("click",resetGame);

document.querySelectorAll(".touch-controls button").forEach(button=>{
  const control=button.dataset.control;
  let repeatDelay=null;
  let repeatInterval=null;
  let pointerStarted=false;

  function stopRepeating(){
    clearTimeout(repeatDelay);
    clearInterval(repeatInterval);
    repeatDelay=null;
    repeatInterval=null;
  }

  button.addEventListener("pointerdown",event=>{
    event.preventDefault();
    initAudio();
    pointerStarted=true;
    button.setPointerCapture(event.pointerId);
    performControl(control);
    if(control==="left"||control==="right"||control==="down"){
      repeatDelay=setTimeout(()=>{
        repeatInterval=setInterval(()=>performControl(control),100);
      },220);
    }
  });
  button.addEventListener("pointerup",stopRepeating);
  button.addEventListener("lostpointercapture",stopRepeating);
  button.addEventListener("pointercancel",()=>{
    pointerStarted=false;
    stopRepeating();
  });
  button.addEventListener("click",()=>{
    if(pointerStarted){
      pointerStarted=false;
      return;
    }
    initAudio();
    performControl(control);
  });
});

function gameLoop(){
  draw();
  requestAnimationFrame(gameLoop);
}

resetGame();
gameLoop();
</script>
</body>
</html>
